{% extends "base.html" %}
{% block title %}Registro{% endblock %}
{% block content %}
<div class="auth">
  <h1>Crear cuenta de cliente</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn" type="submit">Registrarse</button>
  </form>
  <p>¿Ya tienes cuenta? <a href="{% url 'login' %}">Ingresa aquí</a></p>
</div>
{% endblock %}
